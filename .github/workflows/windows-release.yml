name: Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build Windows x64 portable ZIP
        run: |
          python -m pip install ziglang==0.15.2
          python scripts/build_windows.py
          (cd dist && sha256sum -c xSync-Windows-x64.zip.sha256)
      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > release-notes.md <<'NOTES'
          xSync Qt 桌面版，适用于 Windows x64。完整解压后双击 `xSync.exe`。

          支持从资源管理器拖入文件和文件夹、Ctrl+C / Ctrl+V、可改名的工作区标签、按连接保存的收藏夹和 WSL 文件读写。

          远端浏览复用 SSH/SFTP 连接，SFTP 下载并发预读。文件和传输队列均支持右键操作，队列可显示进度、速率和预计剩余时间。
          NOTES
          gh release create "$TAG" --verify-tag --title "xSync $TAG" --notes-file release-notes.md \
            dist/xSync-Windows-x64.zip dist/xSync-Windows-x64.zip.sha256
